<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;1,700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="style.css" />
		<title>Зворотній відлік</title>
	</head>
	<body>
		<div class="container">
			<div class="timer__block">
				<p class="title">До нового року</p>
				<div class="timer">
					<div class="timer__item">
						<div class="count days"><span>0</span><span>0</span><span>0</span></div>
						<div class="text">днів</div>
					</div>
					<div class="timer__item">
						<div class="count hours"><span>0</span><span>0</span></div>
						<div class="text">годин</div>
					</div>
					<div class="timer__item">
						<div class="count minutes"><span>0</span><span>0</span></div>
						<div class="text">хвилин</div>
					</div>
					<div class="timer__item">
						<div class="count seconds"><span>0</span><span>0</span></div>
						<div class="text">секунд</div>
					</div>
				</div>
			</div>
		</div>
	</body>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
	
	
	<script src="app.js"></script>
</html>
