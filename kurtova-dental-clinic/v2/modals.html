<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
<meta http-equiv="X-UA-Compatible" content="IE=edge" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="shortcut icon" href="assets/img/svg/tooth.svg" type="image/x-icon" />
<title>Kurtova Dental Clinic > Home page</title>


	<link rel="stylesheet" href="assets/css/vendors/swiper-bundle.min.css?_v=20240402172346" />



	<link rel="stylesheet" href="assets/css/vendors/fancybox.css?_v=20240402172346" />



<link rel="stylesheet" href="assets/css/style.min.css?_v=20240402172346" />

	</head>

	<body>
		<div class="body-wrapper">
			<main>
				<div class="block__modals-page">
					<div class="container">
						<button class="btn btn--icon-right btn--icon-arrow-rtd" data-modal="modal-make-appointment">
							<span>Записатися на прийом</span>
						</button>
						<button class="btn btn--icon-right btn--icon-arrow-rtd" data-modal="modal-thanks">
							<span>Дякуємо за звернення</span>
						</button>
					</div>
				</div>
			</main>
		</div>

		<div id="modal-make-appointment" style="display: none">
	<div class="modal">
		<button class="btn btn--icon btn--icon-close"><i></i></button>
		<div class="modal__body">
			<h2 class="block__title block__title--large">Записатися на прийом</h2>
			<p class="block__subtitle">Заповніть форму нижче й наші адміністратори зв’яжуться з Вами в найближчий час!</p>

			<form>
				<div class="form__body">
					<div class="row">
						<div class="col-sm-6">
							<div class="form__group">
								<input type="text" class="form__input" name="name" placeholder="Ваше ім'я:" />
							</div>
						</div>
						<div class="col-sm-6">
							<div class="form__group">
								<input type="text" class="form__input" name="phone" placeholder="Ваш телефон:" />
							</div>
						</div>
					</div>

					<p class="block__title block__title--small">Залишились питання?</p>

					<div class="form__group">
						<textarea name="message" class="form__input" placeholder="Ваше запитання:"></textarea>
					</div>

					<div class="modal__actions">
						<button class="btn btn--transparent2 btn--icon-right btn--icon-arrow-rtd" type="submit">
							<span>отримати відповідь</span>
							<i></i>
						</button>
					</div>
				</div>
			</form>
		</div>
	</div>
</div>

<div id="modal-thanks" style="display: none">
	<div class="modal modal--success">
		<button class="btn btn--icon btn--icon-close"><i></i></button>
		<div class="modal__body">
			<h2 class="block__title block__title--large">Дякуємо за звернення!</h2>
			<p class="block__subtitle">Ми зв'яжемося з вами найближчим часом!</p>
			<div class="modal__img-success">
				<img src="assets/img/svg/modal-success.svg" alt="success" />
			</div>
		</div>
		<div class="modal__footer">
			<p>Залишайтеся здоровими!</p>
			<img src="assets/img/svg/heart.svg" alt="heart">
		</div>
	</div>
</div>


		
	<script src="assets/js/vendors/jquery-3.7.1.min.js?_v=20240402172346"></script>



	<script src="assets/js/vendors/swiper-bundle.min.js?_v=20240402172346"></script>





	<script src="assets/js/vendors/fancybox.3.5.7.min.js?_v=20240402172346"></script>



<script src="assets/js/app.js?_v=20240402172346"></script>
	</body>
</html>
