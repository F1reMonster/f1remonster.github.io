<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Block advertising</title>
	<link rel="stylesheet" href="css/style.css" />
	<link rel="stylesheet" href="css/newstyle.css" />
	<link rel="stylesheet" href="css/style-v2.css" />
</head>
<body>
	


	<!-- section text centered-->
	<section class="section section__advertising">
		<div class="container">
			<div class="row">
				<div class="col-lg-4 col-md-12">
					<div class="advertising__item">
						<div class="advertising__body">
							<div class="advertising__title">
								<div class="advertising__icon">
									<img src="img/adv-icon-01.svg" alt="icon">
								</div>
								<h5>Тесты на ковид</h5>
							</div>
							<p>Если нужен текст, то он должен быть тут</p>
						</div>
						<div class="advertising__price">
							<a class="#" href="#"><span>от 1 300 ₽</span></a>
						</div>
					</div>
				</div>
				<div class="col-lg-4 col-md-12">
					<div class="advertising__item">
						<div class="advertising__body">
							<div class="advertising__title">
								<div class="advertising__icon">
									<img src="img/adv-icon-02.png" alt="icon">
								</div>
									
								<h5>Вызов врача на дом</h5>
							</div>
							<p>Возможен вызов как взрослого, так и детского врача</p>
						</div>
						<div class="advertising__price">
							<a class="#" href="#"><span>от 1 300 ₽</span></a>
						</div>
					</div>
				</div>
				<div class="col-lg-4 col-md-12">
					<div class="advertising__item">
						<div class="advertising__body">
							<div class="advertising__title">
								<div class="advertising__icon">
									<img src="img/adv-icon-03.png" alt="icon">
								</div>
								<h5>Вызов медсёстры, забор анализов</h5>
							</div>
							
						</div>
						<div class="advertising__price">
							<a class="#" href="#"><span>от 1 300 ₽</span></a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</section>
	<!-- ./ section text -->


	<script src="js/webfont.js"></script>
	<script>
		WebFont.load({
			custom: {
				//- families: ['Geometria:n4,i4,n7'], // fw 400 + italic, fw700
				families: [
					"Gotham Pro:n3,n4,n5,n7",
					"Museo Sans:n7",
					"Gotham Pro Narrow:n5",
				],
				urls: ["css/fonts.css"],
			},
		});
	</script>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
	<script src="js/libs.min.js"></script>
	<script src="js/main.concat.js"></script>
	<script src="js/new-main.js"></script>

</body>
</html>
