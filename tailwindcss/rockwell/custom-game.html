<!DOCTYPE html>
<html lang="en" class="h-full overflow-clip">
	<head>
		<head>
			<meta charset="utf-8">
<title>RockWell</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="css/style.css" />



			<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
		</head>
	</head>
	<body class="h-full bg-light-gray font-inter text-rich-black">
		<div class="flex h-full flex-col overflow-x-clip">
			<!-- header -->
			<header class="">
				<div class="container">
					<div class="relative h-[195px]">
						<div class="pointer-events-none absolute inset-0 -z-10 overflow-clip bg-gradient-heliotrope-malibu"></div>

						<div class="flex flex-col px-4 py-2.5">
							<div class="flex items-center">
								<div class="flex items-center gap-2">
									<div class="h-6 w-6 overflow-clip rounded-full border border-white">
										<img decoding="async" src="img/user-avatar.webp" title="user avatar" alt="user avatar" loading="lazy" />
									</div>
									<div class="font-semibold text-white">Petro</div>
								</div>

								<div class="ml-auto">
									<div class="flex items-center rounded-2xl border border-white p-1">
										<div class="h-4.5 w-4.5 overflow-clip">
											<img decoding="async" class="" src="img/coin.png" srcset="img/coin2x.png 2x" title="coin" alt="coin" loading="lazy" />
										</div>
										<p class="ml-1 text-sm font-bold tracking-tighter text-white">1620000</p>
										<p class="ml-0.5 mt-1 text-ss text-white">12000/h</p>

										<div class="ml-4 max-h-fit rounded-xl bg-white px-1.5 py-1 text-xs">07:59:59</div>
									</div>
								</div>
							</div>
							<div class="mt-7 px-3 text-white">
								<h1 class="line-clamp-1 text-base font-extrabold">Custom game</h1>
								<p class="mt-1.5 line-clamp-4 text-sm font-medium leading-none">Choose the number of coins that will be the bet in the game. A player with the same bet will be matched to you automatically.</p>
							</div>
						</div>
					</div>
				</div>
			</header>
			<!-- ./header -->

			<main class="relative">
				<div class="container">
					<div class="-mt-5 flex h-[calc(var(--app-height)-10.9375rem)] min-h-20 flex-col rounded-tl-3xl rounded-tr-3xl bg-light-gray px-4 pb-10 pt-4">
						<div class="flex flex-grow items-center justify-center">
							<div class="relative flex w-fit items-center justify-center gap-15">
								<div class="w-14">
									<div id="fromSlider" class="swiper h-74">
										<div class="swiper-wrapper">
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">80</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">90</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">100</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">110</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">120</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">130</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">140</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">150</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">160</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">170</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">180</div>
											</div>
										</div>
									</div>
								</div>

								<div class="w-14">
									<div id="toSlider" class="swiper h-74">
										<div class="swiper-wrapper">
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">110</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">120</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">130</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">140</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">150</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">160</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">170</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">180</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">190</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">200</div>
											</div>
											<div class="swiper-slide">
												<div class="text-center leading-none transition-all duration-200">210</div>
											</div>
										</div>
									</div>
								</div>

								<div class="pointer-events-none absolute top-1/2 h-13 w-[calc(100%+9.375rem)] -translate-y-1/2 rounded-3xl bg-gradient-radial-yellow px-6 xm:w-86">
									<div class="absolute inset-1 rounded-3xl bg-white"></div>
									<div class="flex h-full items-center justify-between">
										<p class="z-1 flex text-xl leading-none">From</p>
										<p class="z-1 flex text-xl leading-none">to</p>
										<p class="z-1 flex text-xl leading-none">coins</p>
									</div>
								</div>
							</div>
						</div>

						<div class="mt-6">
							<button class="flex h-12 w-full items-center justify-center rounded-3xl bg-gradient-heliotrope-malibu p-3 text-sm font-bold text-white">Let’s GO!</button>
						</div>
					</div>
				</div>
			</main>

			<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
			
<script src="js/app.js"></script>
		</div>
	</body>
</html>
