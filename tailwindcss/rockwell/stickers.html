<!DOCTYPE html>
<html lang="en" class="h-full overflow-clip">
	<head>
		<head>
			<meta charset="utf-8">
<title>RockWell</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="css/style.css" />



		</head>
	</head>
	<body class="h-full bg-light-gray font-inter text-rich-black">
		<div class="flex h-full flex-col overflow-x-clip">
			<!-- header -->
			<header class="">
				<div class="container">
					<div class="relative h-[195px]">
						<div class="pointer-events-none absolute inset-0 -z-10 overflow-clip bg-gradient-heliotrope-malibu">
							<div class="absolute -left-8 top-5 h-60 w-60">
								<img decoding="async" class="h-full w-full object-contain" src="img/mine-new-bg.webp" title="bg" alt="bg" loading="lazy" />
							</div>
						</div>

						<div class="flex flex-col px-4 py-2.5">
							<div class="flex items-center">
								<div class="flex items-center gap-2">
									<div class="h-6 w-6 overflow-clip rounded-full border border-white">
										<img decoding="async" src="img/user-avatar.webp" title="user avatar" alt="user avatar" loading="lazy" />
									</div>
									<div class="font-semibold text-white">Petro</div>
								</div>

								<div class="ml-auto">
									<div class="flex items-center rounded-2xl border border-white p-1">
										<div class="h-4.5 w-4.5 overflow-clip">
											<img decoding="async" class="" src="img/coin.png" srcset="img/coin2x.png 2x" title="coin" alt="coin" loading="lazy" />
										</div>
										<p class="ml-1 text-sm font-bold tracking-tighter text-white">1620000</p>
										<p class="ml-0.5 mt-1 text-ss text-white">12000/h</p>

										<div class="ml-4 max-h-fit rounded-xl bg-white px-1.5 py-1 text-xs">07:59:59</div>
									</div>
								</div>
							</div>
							<div class="ml-auto mt-7 max-w-40 text-white">
								<h1 class="line-clamp-1 text-base font-extrabold">Collections</h1>
								<p class="mt-1.5 line-clamp-4 text-sm font-medium leading-none">Buy stickers and increase your passive income.</p>
							</div>
						</div>
					</div>
				</div>
			</header>
			<!-- ./header -->

			<main class="relative">
				<div class="container">
					<div class="-mt-5 h-[calc(var(--app-height)-17.5rem)] min-h-20 rounded-tl-3xl rounded-tr-3xl bg-light-gray pl-4 pr-2 pt-4">
						<div class="flex h-full flex-col gap-4 overflow-y-auto pb-4 pr-2 scrollbar-thin">
							<!-- card -->
							<div class="flex h-48 flex-shrink-0 gap-4 rounded-2xl border border-border-gray bg-white p-2">
								<div class="h-full w-33 flex-shrink-0 overflow-clip rounded-lx">
									<img decoding="async" class="h-full w-full object-cover" src="img/cards/card-01.webp" title="Card" alt="Card" loading="lazy" />
								</div>
								<div class="flex w-full flex-col py-2">
									<div class="w-fit rounded-xl bg-shandy px-2 py-1 text-xs">Total: 307 stickers</div>
									<h2 class="mt-2 pb-2 text-base font-semibold">%Collection name 1%</h2>
									<div class="mt-auto h-4 w-full rounded-lg bg-switcher p-0.5 shadow-progress-bg" style="--progress: 100">
										<div class="h-full rounded-md bg-gradient-heliotrope-malibu" style="width: calc(var(--progress) * 1%)"></div>
									</div>
									<div class="mt-2 flex items-center justify-between">
										<div class="text-sm">100/100</div>
										<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
											<path d="M9 18L15 12L9 6" stroke="#DCDCDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											<path d="M9 18L15 12L9 6" stroke="#91BFFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
										</svg>
									</div>
								</div>
							</div>
							<!-- ./card -->

							<!-- card -->
							<div class="flex h-48 flex-shrink-0 gap-4 rounded-2xl border border-border-gray bg-white p-2">
								<div class="h-full w-33 flex-shrink-0 overflow-clip rounded-lx">
									<img decoding="async" class="h-full w-full object-cover" src="img/cards/card-02.webp" title="Card" alt="Card" loading="lazy" />
								</div>
								<div class="flex w-full flex-col py-2">
									<div class="w-fit rounded-xl bg-shandy px-2 py-1 text-xs">Total: 64 stickers</div>
									<h2 class="mt-2 pb-2 text-base font-semibold">Flags of the world's nations.</h2>
									<div class="mt-auto h-4 w-full rounded-lg bg-switcher p-0.5 shadow-progress-bg" style="--progress: 31">
										<div class="h-full rounded-md bg-gradient-heliotrope-malibu" style="width: calc(var(--progress) * 1%)"></div>
									</div>
									<div class="mt-2 flex items-center justify-between">
										<div class="text-sm">31/100</div>
										<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
											<path d="M9 18L15 12L9 6" stroke="#DCDCDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											<path d="M9 18L15 12L9 6" stroke="#91BFFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
										</svg>
									</div>
								</div>
							</div>
							<!-- ./card -->

							<!-- card -->
							<div class="flex h-48 flex-shrink-0 gap-4 rounded-2xl border border-border-gray bg-white p-2">
								<div class="h-full w-33 flex-shrink-0 overflow-clip rounded-lx">
									<img decoding="async" class="h-full w-full object-cover" src="img/cards/card-03.webp" title="Card" alt="Card" loading="lazy" />
								</div>
								<div class="flex w-full flex-col py-2">
									<div class="w-fit rounded-xl bg-shandy px-2 py-1 text-xs">Total: 5 stickers</div>
									<h2 class="mt-2 pb-2 text-base font-semibold">%Collection name 3%</h2>
									<div class="mt-auto h-4 w-full rounded-lg bg-switcher p-0.5 shadow-progress-bg" style="--progress: 3">
										<div class="h-full rounded-md bg-gradient-heliotrope-malibu" style="width: calc(var(--progress) * 1%)"></div>
									</div>
									<div class="mt-2 flex items-center justify-between">
										<div class="text-sm">3/100</div>
										<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
											<path d="M9 18L15 12L9 6" stroke="#DCDCDC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
											<path d="M9 18L15 12L9 6" stroke="#91BFFA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
										</svg>
									</div>
								</div>
							</div>
							<!-- ./card -->
						</div>
					</div>
				</div>
			</main>

			<div class="fixed bottom-0 left-0 z-20 w-full">
	<div class="container">
		<div class="flex justify-between w-full bg-white rounded-t-3xl h-[6.5625rem] shadow-menu px-3">
			<a class="flex flex-col items-center gap-2 px-1 pt-4 text-sm" href="index.html">
				<div class="relative flex-shrink-0">
					<img width="44" height="44" class="h-11 w-11" src="img/home.png" srcset="img/home2x.png 2x" alt="Mine" decoding="async" loading="lazy" />
				</div>
				Home
			</a>

			<a class="flex flex-col items-center gap-2 px-1 pt-4 text-sm" href="stickers.html">
				<div class="relative flex-shrink-0">
					<img width="44" height="44" class="h-11 w-11" src="img/stickers.png" srcset="img/stickers2x.png 2x" alt="Stickers" decoding="async" loading="lazy" />
					<!-- add this if active -->
					<div class="absolute inset-0 bg-gradient-heliotrope-malibu mix-blend-color"></div>
					<!-- ./add this if active -->
				</div>
				Stickers
			</a>
			<a class="flex flex-col items-center gap-2 px-1 pt-4 text-sm" href="friends.html">
				<div class="relative flex-shrink-0">
					<img width="44" height="44" class="h-11 w-11" src="img/friends.png"  srcset="img/friends2x.png 2x" alt="Friends" decoding="async" loading="lazy" />
				</div>
				Friends
			</a>
			<a class="flex flex-col items-center gap-2 px-1 pt-4 text-sm" href="earn.html">
				<div class="relative flex-shrink-0">
					<img width="44" height="44" class="h-11 w-11" src="img/earn.png" srcset="img/earn2x.png 2x" alt="Earn" decoding="async" loading="lazy"  />
				</div>
				Earn
			</a>
			<a class="flex flex-col items-center gap-2 px-1 pt-4 text-sm" href="profile.html">
				<div class="relative flex-shrink-0">
					<img width="44" height="44" class="h-11 w-11" src="img/profile.png" srcset="img/profile2x.png 2x" alt="Profile" decoding="async" loading="lazy"  />
				</div>
				Profile
			</a>
		</div>
	</div>
</div>
 <footer class="w-full bg-white">
</footer> 
<script src="js/app.js"></script>
		</div>
	</body>
</html>
