	<body class="flex flex-col h-full overflow-clip font-inter">

		<!-- asset moments stop recording modal -->
<div class="fixed inset-0 z-50 p-4">
	<div class="absolute inset-0 bg-primary-black/60"></div>

	<div class="flex items-center justify-center w-full h-full">
		<div class="relative z-20 p-6 bg-white border shadow-lg w-110 rounded-3xl border-neutral-black-5">
			<div class="flex items-center justify-center w-12 h-12 border-8 rounded-full border-provincial-pink bg-cinderella">
				<span class="icon icon--info text-error-100"></span>
			</div>
			<p class="mt-5 text-lg font-medium">Deactivate link</p>
			<p class="mt-2 text-sm text-neutral-black-70">Are you sure you want to deactivate this link? This action cannot be undone.</p>
			
			<div class="mt-8 flex gap-2.5 lw:flex-row flex-col">
				<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-neutral-black-5 px-5 py-3.5 text-sm transition-all duration-300 hover:bg-neutral-black-1">
					<span>Cancel</span>
				</button>
				<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-error-60 px-5 py-3.5 text-sm font-semibold text-white transition-all duration-300 hover:bg-error-60/80 lw:order-none -order-1">
					<span>Deactivate</span>
				</button>
			</div>
		</div>
	</div>
</div>
