<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
<title>Legacy space - Portfolio page</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="../../css/style.css" />

	</head>

	<body class="flex flex-col h-full overflow-clip font-inter">
		<main class="flex-grow py-4 lg:py-12"></main>

		<!-- transfer ownership confirmed modal -->
<div class="fixed inset-0 z-50 p-4">
	<div class="absolute inset-0 bg-primary-black/60"></div>

	<div class="flex items-center justify-center w-full h-full">
		<div class="relative z-20 bg-white border shadow-lg w-110 rounded-3xl border-neutral-black-5">
			<div class="px-6 pt-6 pb-5 border-b border-b-neutral-black-5">
				<div class="flex items-center justify-center w-12 h-12 border-8 rounded-full border-feta bg-gossip-10">
					<span class="icon icon--check-circle text-success-50"></span>
				</div>
				<p class="mt-5 text-lg font-medium">The transfer of ownership confirmed!</p>
				<p class="mt-2 text-sm text-neutral-black-70">Johnny has confirmed your request for the transfer of ownership of the asset.</p>
			</div>

			<div class="px-6 pt-5 pb-6">
				<p class="text-sm font-medium">To complete the transaction, enter your account password</p>

				<div class="mt-2">
					<div class="relative flex flex-grow w-full">
						<input type="password" class="h-12 w-full rounded-xl border border-primary-green-gray bg-primary-green-gray py-3 pl-3.5 pr-13 text-primary-black transition-all duration-300 placeholder:text-neutral-black-50 focus:border-secondary focus:bg-white focus:shadow-input" value="123456">
						<button class="absolute flex -translate-y-1/2 right-3 top-1/2 z-1">
							<span class="icon icon--eye-hidden text-neutral-black-70"></span>
						</button>
					</div>
				</div>

				<div class="mt-8 flex flex-col gap-2.5 xs:flex-row">
					<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-neutral-black-5 px-5 py-3.5 text-sm font-medium transition-all duration-300 hover:bg-neutral-black-1">
						<span>Quit</span>
					</button>
					<button class="-order-1 flex h-12 w-full items-center justify-center gap-2 rounded-xl bg-primary px-5 py-3.5 text-sm font-semibold transition-all duration-300 hover:bg-primary-hover xs:order-none">
						<span>Continue editing</span>
					</button>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- ./transfer ownership confirmed modal -->
 
		<script src="../../js/app.js"></script>


		
	</body>
</html>
