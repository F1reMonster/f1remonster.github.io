<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
<title>Legacy space - Portfolio page</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="../../css/style.css" />

	</head>

	<body class="flex flex-col h-full overflow-clip font-inter">
		<main class="flex-grow py-4 lg:py-12"></main>
		
		<!-- share asset / generated link modal -->
<div class="fixed inset-0 z-50 p-4">
	<div class="absolute inset-0 bg-primary-black/60"></div>

	<div class="flex h-full w-full items-center justify-center">
		<div class="relative z-20 max-h-[calc(var(--app-height)-2rem)] w-167.5 overflow-auto rounded-3xl border border-neutral-black-5 bg-white p-6 shadow-lg lg:p-10">
			<h1 class="mt-1.5 border-b border-b-neutral-black-3 pb-5 text-sm2x font-semibold leading-125 tracking-tight lg:pb-6 lg:text-base2x">Share your asset</h1>

			<div class="mt-8">
				<div class="flex flex-col gap-6 sm:flex-row">
					<div class="aspect-square flex-shrink-0 overflow-clip sm:w-21.5">
						<img decoding="async" class="aspect-square w-full" src="../../img/qr-code-share-generated-link.webp" title="" alt="" loading="lazy" />
					</div>

					<div class="flex flex-1 flex-col">
						<p class="text-sm font-medium">Public link created</p>
						<div class="mt-2 flex items-center justify-between gap-3 rounded-xl border border-neutral-black-70 px-3.5 py-4">
							<input type="text" class="w-full border-0 p-0" disabled readonly value="https://dev.artexpert.io/dashboard/" />
							<button class="flex flex-shrink-0 items-center gap-2 text-sm font-medium text-secondary transition-all duration-300 active:scale-95">
								<span class="icon icon--copy"></span>
								<span>Copy link</span>
							</button>
						</div>
					</div>
				</div>
			</div>
			<div class="mt-5 flex flex-col gap-2.5 lw:flex-row lg:mt-8">
				<button class="flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-neutral-black-5 px-5 py-3.5 text-sm font-medium transition-all duration-300 hover:bg-neutral-black-1">
					<span>Cancel</span>
				</button>
				<button class="-order-1 flex h-12 w-full items-center justify-center gap-2 rounded-xl border border-error-60 px-5 py-3.5 text-sm font-medium text-error-60 transition-all duration-300 hover:bg-error-60/10 lw:order-none">
					<span>Deactivate link</span>
				</button>
			</div>
		</div>
	</div>
</div>
<!-- ./share asset / generated link modal -->
 
		<script src="../../js/app.js"></script>

	</body>
</html>
