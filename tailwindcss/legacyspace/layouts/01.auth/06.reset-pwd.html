<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
<title>Legacy space - Reset password page</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="../../css/style.css" />

	</head>

	<body class="flex h-full flex-col font-inter">
		<header class="border-b border-neutral-black-5">
	<div class="container">
		<div class="flex items-center justify-center gap-4 py-5 lg:py-10">
			<a href="../../index.html">
				<img decoding="async" src="../../img/svg/logo.svg" title="" alt="" loading="lazy" class="w-25.5 lg:w-35" />
			</a>
		</div>
	</div>
</header>

		<main class="flex-grow">
			<div class="container flex h-full flex-col py-13 lg:py-10">
				<div class="mx-auto w-full max-w-110">
					<div class="text-center">
						<h1 class="text-sm2x font-semibold leading-125 tracking-tight text-primary-black lg:text-base2x">Change your password</h1>
						<p class="mt-2 text-sm leading-150 text-neutral-black-70 lg:text-base">Enter your new password below to change your password.</p>
					</div>

					<div class="mt-9">
						<label class="mt-5 flex flex-col gap-2">
							<span class="text-sm font-semibold leading-150 tracking-tight text-primary-black">Enter a new password</span>
							<div class="relative flex w-full flex-grow">
								<input type="text" class="h-12 w-full rounded-xl border border-primary-green-gray bg-primary-green-gray py-3 pl-3.5 pr-13 text-primary-black transition-all duration-300 placeholder:text-neutral-black-50 focus:border-secondary focus:bg-white focus:shadow-input" />
								<button class="absolute right-3 top-1/2 z-1 -translate-y-1/2">
									<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
										<path fill-rule="evenodd" clip-rule="evenodd" d="M3.11824 12.467C2.96124 12.176 2.96124 11.823 3.11824 11.532C5.01024 8.033 8.50524 5 12.0002 5C15.4952 5 18.9902 8.033 20.8822 11.533C21.0392 11.824 21.0392 12.177 20.8822 12.468C18.9902 15.967 15.4952 19 12.0002 19C8.50524 19 5.01024 15.967 3.11824 12.467Z" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M14.1213 9.87868C15.2929 11.0502 15.2929 12.9497 14.1213 14.1213C12.9497 15.2929 11.0502 15.2929 9.87868 14.1213C8.70711 12.9497 8.70711 11.0502 9.87868 9.87868C11.0502 8.70711 12.9497 8.70711 14.1213 9.87868" stroke="#82858B" stroke-width="1.4286" stroke-linecap="round" stroke-linejoin="round" />
									</svg>
								</button>
							</div>
						</label>
						<label class="mt-5 flex flex-col gap-2">
							<span class="text-sm font-semibold leading-150 tracking-tight text-primary-black">Repeat password</span>
							<div class="relative flex w-full flex-grow">
								<input type="password" class="h-12 w-full rounded-xl border border-primary-green-gray bg-primary-green-gray py-3 pl-3.5 pr-13 text-primary-black transition-all duration-300 placeholder:text-neutral-black-50 focus:border-secondary focus:bg-white focus:shadow-input" value="123456" />
								<button class="absolute right-3 top-1/2 z-1 -translate-y-1/2">
									<svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
										<path d="M12.0001 18.9999C11.1581 18.9999 10.3151 18.8219 9.49609 18.5049" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M20.882 12.468C18.99 15.967 15.495 19 12 19" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M19.0791 8.92102C19.7701 9.73002 20.3841 10.612 20.8821 11.533C21.0391 11.824 21.0391 12.177 20.8821 12.468" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M5 19L19 5" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M9.77309 14.227C8.54309 12.997 8.54309 11.002 9.77309 9.77199C11.0031 8.54199 12.9981 8.54199 14.2281 9.77199" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
										<path d="M17.0442 6.956C15.4972 5.759 13.7482 5 12.0002 5C8.50524 5 5.01024 8.033 3.11824 11.533C2.96124 11.824 2.96124 12.177 3.11824 12.468C4.06424 14.217 5.41024 15.849 6.95624 17.045" stroke="#82858B" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
									</svg>
								</button>
							</div>
						</label>
						<button class="mt-12 flex h-12 w-full items-center justify-center rounded-xl bg-primary px-3.5 py-3 text-sm font-semibold text-primary-100 transition-all duration-300 hover:bg-primary-hover">Change password</button>
					</div>
				</div>
			</div>
		</main>
		<script src="../../js/app.js"></script>

	</body>
</html>
