<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
<title>Legacy space - Forgot password page</title>
<meta name="viewport" content="width=device-width, initial-scale=1 user-scalable=yes">
<link rel="canonical" href='' />
<meta name="MobileOptimized" content="width"/>
<meta name="HandheldFriendly" content="True"/>
<meta name="viewport" content="initial-scale=1.0, width=device-width">
<link rel="stylesheet" type="text/css" href="../../css/style.css" />

	</head>

	<body class="flex h-full flex-col font-inter">
		<header class="border-b border-neutral-black-5">
	<div class="container">
		<div class="flex items-center justify-center gap-4 py-5 lg:py-10">
			<a href="../../index.html">
				<img decoding="async" src="../../img/svg/logo.svg" title="" alt="" loading="lazy" class="w-25.5 lg:w-35" />
			</a>
		</div>
	</div>
</header>

		<main class="flex-grow">
			<div class="container flex h-full flex-col py-13 lg:py-10">
				<div class="mx-auto w-full max-w-110">
					<div class="text-center">
						<h1 class="text-sm2x font-semibold leading-125 tracking-tight text-primary-black lg:text-base2x">Forgot your password?</h1>
						<p class="mt-2 text-sm leading-150 text-neutral-black-70 lg:text-base">Enter your email address and we will send you reset link.</p>
					</div>

					<div class="mt-9">
						<label class="mt-5 flex flex-col gap-2">
							<span class="text-sm font-semibold leading-150 tracking-tight text-primary-black">Email address</span>
							<input type="email" class="h-12 w-full rounded-xl border border-primary-green-gray bg-primary-green-gray px-3.5 py-3 text-primary-black transition-all duration-300 placeholder:text-neutral-black-50 focus:border-secondary focus:bg-white focus:shadow-input" placeholder="anreychernov@gmail.com" />
						</label>

						<button class="mt-5 flex h-12 w-full items-center justify-center rounded-xl bg-primary px-3.5 py-3 text-sm font-semibold text-primary-100 transition-all duration-300 hover:bg-primary-hover">Change password</button>
					</div>

					<div class="mt-6">
						<div class="mt-1 flex justify-center gap-2 text-sm text-primary-black">
							<a href="#" class="text-secondary transition-all duration-300 hover:text-secondary-30">Back to Login</a>
						</div>
					</div>
				</div>
			</div>
		</main>
		<script src="../../js/app.js"></script>

	</body>
</html>
