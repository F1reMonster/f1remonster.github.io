<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Google Play Clone</title>

		<link rel="stylesheet" href="assets/css/styles.css" />
	</head>
	<style>
		.index-header {
			display: flex;
			align-items: center;
			gap: 1.5rem;
			padding: 16px 0;
		}

		.index-header p {
			font-size: 1rem;
			font-weight: 500;
			color: var(--deep-sea);
		}

		.index-logo {
			display: flex;
			gap: 1rem;
			align-items: center;
			font-family: var(--font-secondary);
			font-size: 1.5rem;
			font-weight: 600;
			line-height: 120%;
			
		}

		.index-logo svg {
			width: 2rem;
			height: 2rem;
			flex-shrink: 0;
		}

		.index-pages-list {
			columns: 1;
			margin-top: 2rem;
		}

		.index-pages-list li {
			page-break-inside: avoid;
		}

		.index-pages-list li:not(:first-child) {
			margin-top: 1rem;
		}

		.index-pages-list li p:first-child {
			font-family: var(--font-secondary);
			font-size: 1.125rem;
			font-weight: 500;
			color: var(--deep-sea);
		}

		.index-pages-list li p {
			font-size: 0.875rem;
			color: var(--shuttle-gray);
		}

		@media (min-width: 37.5em) {
			.index-logo {
				font-size: 2.5rem;
			}

			.index-logo svg {
				width: 3rem;
				height: 3rem;
			}

			.index-header p {
				font-size: 1.375rem;
			}
		}

		@media (min-width: 450px) {
			.index-pages-list {
				columns: 2;
			}
		}

		
	</style>
	<body>
		<div class="container">
			<div class="index-header">
				<div aria-label="Логотип Google Play" class="index-logo">
					<svg aria-hidden="true" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
						<path fill="none" d="M0,0h40v40H0V0z"></path>
						<g>
							<path d="M19.7,19.2L4.3,35.3c0,0,0,0,0,0c0.5,1.7,2.1,3,4,3c0.8,0,1.5-0.2,2.1-0.6l0,0l17.4-9.9L19.7,19.2z" fill="#EA4335"></path>
							<path d="M35.3,16.4L35.3,16.4l-7.5-4.3l-8.4,7.4l8.5,8.3l7.5-4.2c1.3-0.7,2.2-2.1,2.2-3.6C37.5,18.5,36.6,17.1,35.3,16.4z" fill="#FBBC04"></path>
							<path d="M4.3,4.7C4.2,5,4.2,5.4,4.2,5.8v28.5c0,0.4,0,0.7,0.1,1.1l16-15.7L4.3,4.7z" fill="#4285F4"></path>
							<path d="M19.8,20l8-7.9L10.5,2.3C9.9,1.9,9.1,1.7,8.3,1.7c-1.9,0-3.6,1.3-4,3c0,0,0,0,0,0L19.8,20z" fill="#34A853"></path>
						</g>
					</svg>

					<span>Google Play Clone</span>
				</div>
				<p>Completed pages</p>
			</div>

			<ul class="index-pages-list">
				<li>
					<a href="home-page.html">
						<p>Home page</p>
						<p>home-page.html</p>
					</a>
				</li>
				<li>
					<a href="category-page.html">
						<p>Category page</p>
						<p>category-page.html</p>
					</a>
				</li>
				<li>
					<a href="app-page.html">
						<p>App page</p>
						<p>app-page.html</p>
					</a>
				</li>
			</ul>
		</div>
	</body>
</html>
