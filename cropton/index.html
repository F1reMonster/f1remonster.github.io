<style>
	.body-wrapper {
		height: 100vh;
	}
	
	.block__pages-list {
		display: flex;
		flex-flow: wrap;
		margin-top: 40px;
		

		margin-right: -10px;
		margin-left: -10px;
	}

	.block__pages-list>* {
		margin-right: 10px;
		margin-left: 10px;
	}

	.block__pages-item {
		padding: 10px 0;
		width: calc(50% - 20px);
	}

	.block__pages-item a {
		font-size: 24px;
		color: black;
		transition: color 0.2s ease-out;
	}

	.block__pages-item a span {
		font-size: 14px;
	}

	.block__pages-item a:hover {
		color: #d40031;
	}

	.block__rtl {
		margin-top: 30px;
	}

	.block__rtl .block__pages-list {
		margin-top: 0;
	}

	.theme__dark .block__pages-item a {
		font-size: 24px;
		color: white;
		transition: color 0.2s ease-out;
	}

	.theme__dark .block__pages-item a:hover {
		color: #7CBFFF;
	}
</style>

</div>
