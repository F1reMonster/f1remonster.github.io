<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
<meta name="description" content="Meta descritpion page" />
<meta name="keywords" content="kyewords, for, search, optimization " />
<meta name="author" content="Author Name" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="X-UA-Compatible" content="ie=edge" />
<link rel="shortcut icon" href="img/favicon.svg" type="image/x-icon" />
<link rel="stylesheet" type="text/css" href="./css/style.css?v=202306072246" />
<title>Доказ - Реєстрація кліента</title>
	</head>
	<body>
		<header>
			<div class="container">
				<div class="flex justify-between items-center py-[1.875rem] lg:py-[1.25rem]">
					<a href="#" class="group flex items-center gap-[0.75rem] text-electric-violet xlg:text-[0.875rem]">
						<svg class="xlg:h-[0.875rem] xlg:w-[0.875rem]" width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
							<path class="transition-all group-hover:stroke-black" d="M8.30287 0.999972L0.999999 8.30284L8.30287 15.6057" stroke="#7900F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
							<path class="transition-all group-hover:stroke-black" d="M1 8.30284L15.5 8.30285" stroke="#7900F3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
						</svg>
						<span class="transition-all group-hover:text-black">Назад</span>
					</a>

					<button class="btn-orange-light" aria-label="Вхід">Вхід</button>
				</div>
			</div>
		</header>
		<main>
			<section class="mx-auto max-w-[37.5rem] px-[0.9375rem]">
				<h1 class="text-center text-[2.5rem] font-semibold lg:text-[1.75rem] md:text-[1.125rem]">Реєстрація кліента</h1>
				<p class="mt-4 text-center text-[1.0625rem] text-gray">Почніть роботу з кількох простих кроків</p>
				<form action="" class="-translate-x-[17%] md:translate-x-0">
					<div class="mt-[3.125rem] flex flex-col items-center justify-center gap-[1.25rem] exmd:mt-[1.875rem]">
						<div class="w-full">
							<label class="flex w-full items-center gap-[1.875rem] exmd:ml-0 exmd:flex-col exmd:items-start exmd:gap-2">
								<span class="ml-auto text-right text-gray exmd:ml-0 exmd:text-left">Ім'я</span>
								<input type="text" class="w-[23.125rem] exmd:w-full" name="name" placeholder="Константин" required />
							</label>
						</div>
						<div class="w-full">
							<label class="flex w-full items-center gap-[1.875rem] exmd:ml-0 exmd:flex-col exmd:items-start exmd:gap-2">
								<span class="ml-auto text-right text-gray exmd:ml-0 exmd:text-left">Прізвище</span>
								<input type="text" class="w-[23.125rem] exmd:w-full" name="surname" placeholder="Константинопольский" required />
							</label>
						</div>
						<div class="w-full">
							<label class="flex w-full items-center gap-[1.875rem] exmd:ml-0 exmd:flex-col exmd:items-start exmd:gap-2">
								<span class="ml-auto text-right text-gray exmd:ml-0 exmd:text-left">Електропошта</span>
								<input type="email" class="error w-[23.125rem] exmd:w-full" name="email" placeholder="konstantin@gmail.com" value="esdsj@" required />
							</label>
							<p class="ml-auto mt-2 w-[23.125rem] text-[0.875rem] text-pomegranate exmd:w-full">Це поле обов'язкове до заповнення</p>
						</div>
						<div class="w-full">
							<label class="relative flex w-full items-center gap-[1.875rem] exmd:ml-0 exmd:flex-col exmd:items-start exmd:gap-2">
								<span class="ml-auto text-right text-gray exmd:ml-0 exmd:text-left">Пароль</span>
								<input type="password" class="w-[23.125rem] pr-[40px] exmd:w-full" required />
								<button type="button" class="absolute right-[1.25rem] top-[50%] z-[1] -translate-y-1/2 exmd:top-[2.375rem] exmd:translate-y-0">
									<svg width="28" height="19" viewBox="0 0 28 19" fill="none" xmlns="http://www.w3.org/2000/svg">
										<path d="M14.265 1C7.40521 1 2.6377 6.51095 1 9.45867C2.46774 12.4064 6.89534 18 13.7551 18C20.6149 18 25.3623 12.4342 27 9.48649C25.5323 6.53877 21.1248 1 14.265 1Z" stroke="#BFBFBF" stroke-linejoin="round" />
										<path d="M17.4822 9.5C17.4822 11.456 15.9231 13.0417 14 13.0417C12.0769 13.0417 10.5179 11.456 10.5179 9.5C10.5179 7.54399 12.0769 5.95833 14 5.95833C15.9231 5.95833 17.4822 7.54399 17.4822 9.5Z" stroke="#BFBFBF" stroke-linejoin="round" />
									</svg>
								</button>
							</label>
						</div>
						<div class="w-full">
							<label class="relative flex w-full items-center gap-[1.875rem] exmd:ml-0 exmd:flex-col exmd:items-start exmd:gap-2">
								<span class="ml-auto text-right text-gray exmd:ml-0 exmd:text-left">Повторіть пароль</span>
								<input type="password" class="w-[23.125rem] exmd:w-full" required />
								<button type="button" class="absolute right-[1.25rem] top-[50%] z-[1] -translate-y-1/2 exmd:top-[2.375rem] exmd:translate-y-0">
									<svg width="28" height="24" viewBox="0 0 28 24" fill="none" xmlns="http://www.w3.org/2000/svg">
										<path d="M14.265 3.52301C7.40521 3.52301 2.6377 9.01904 1 11.9588C1.623 13.2066 2.77926 14.9298 4.42843 16.5M21.8009 6.00275C24.4103 7.84994 26.1724 10.329 27 11.9865C25.3623 14.9263 20.6149 20.477 13.7551 20.477C11.9683 20.477 10.3464 20.0985 8.89894 19.4867M17.1849 10.5698C17.376 11.007 17.4822 11.4909 17.4822 12C17.4822 13.9507 15.9231 15.5321 14 15.5321C13.5523 15.5321 13.1243 15.4464 12.7312 15.2902M3.32905 23L24.671 1" stroke="#BFBFBF" stroke-linecap="round" stroke-linejoin="round" />
									</svg>
								</button>
							</label>
						</div>
						<button class="btn-orange ml-auto mt-[2.8125rem] py-5 font-semibold w-[23.125rem] exmd:w-full exmd:mt-[0.9375rem]" disabled>Зареєстуватись</button>

						<div class="ml-auto w-[23.75rem] exmd:w-full">
							<label class="group flex cursor-pointer gap-3 text-[0.875rem] leading-[178%] relative">
								<input type="checkbox" name="agreement" class="peer hidden" />
								<div class="flex h-[1.6875rem] w-[1.6875rem] shrink-0 rounded-[7px] border border-mercury transition ease-in group-hover:border-silver peer-checked:border-bamboo">
								</div>
								<svg class="absolute top-[0.5rem] left-[0.4375rem] opacity-0 peer-checked:opacity-100 transition ease-in" width="14" height="10" viewBox="0 0 14 10" fill="none" xmlns="http://www.w3.org/2000/svg">
									<path d="M13 1L5 9L1 5" stroke="#DA6900" />
								</svg>
								<div class="text-gray">
									Реєструючись, ви тим самим приймаєте наші <br />
									<a href="#" class="text-black hover:text-electric-violet transition ease-in">Угоди користувача</a> та <a href="#" class="text-black hover:text-electric-violet transition ease-in">Політику конфіденційності</a>
								</div>
							</label>
						</div>
					</div>
				</form>
			</section>
		</main>
	</body>
</html>
